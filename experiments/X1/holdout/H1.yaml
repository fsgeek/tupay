schedule: H1
derives: [C2.1, C1.2, F1.2, F1.3]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: hold-out H1 (C2.1, C1.2, F1.2, F1.3). Partition and pause composed: the paused old holder resumes inside a partition that still reaches storage, reads and writes with its old token after a newer write was accepted on the other side before the cut.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1, outcome: accepted}, do: {cell: F1.3, pause: c1}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {cell: F1.2, partition: [[c1, s], [rest]]}}
  - {at: start, do: {cell: F1.3, resume: c1}}
  - {at: start, do: {read: c1}}
  - {at: {event: ReadAck, client: c1}, do: {write: c1, value: v3}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F1.2, heal: true}}
end: quiescent
bound: {events: 200}
