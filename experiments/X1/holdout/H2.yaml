schedule: H2
derives: [C2.2, C1.3, F1.1, F1.2]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: hold-out H2 (C2.2, C1.3, F1.1, F1.2). Storage crashes with a served read's ack unsent, restarts inside a partition from the reader, then heals; the reader must not be given a value for the lost serve, and a later read's value matches.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1, outcome: accepted}, do: {read: c1}}
  - {at: {event: ReadAccept}, do: {cell: F1.1, crash: s}}
  - {at: start, do: {cell: F1.2, partition: [[holder], [rest]]}}
  - {at: start, do: {cell: F1.1, restart: s}}
  - {at: start, do: {cell: F1.2, heal: true}}
  - {at: start, do: {read: c1}}
end: quiescent
bound: {events: 200}
