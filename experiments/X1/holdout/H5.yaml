schedule: H5
derives: [C2.2, C1.3, C1.1, F1.2, F1.1]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: hold-out H5 (C2.2, C1.3, C1.1, F1.2, F1.1). The grantor is isolated with the holder and storage; the holder reads and writes during the cut; the majority side grants; after the heal the old grantor crashes; the old holder's late read and the new holder's read must report what storage actually held.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {cell: F1.2, partition: [[grantor, holder, s], [rest]]}}
  - {at: start, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1}, do: {read: c1}}
  - {at: {event: ReadAck, client: c1}, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {cell: F1.2, heal: true}}
  - {at: start, do: {cell: F1.1, crash: grantor}}
  - {at: start, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {read: c1}}
  - {at: {event: ReadAck, client: c1}, do: {read: c2}}
end: quiescent
bound: {events: 200}
