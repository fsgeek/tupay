scenario: K1
derives: [J1.2, J1.1, G1.3, G1.4]
initial: [m1, m2, m3, m4]
steps:
  # derives: the known 2015 counterexample, steered. Withheld; a faithfulness check on both sides, not a detection route. v2 (third steward): event triggers only, cuts accumulate, one heal (v1's `at: start` after step 1 can never fire under the format's arming rule).
  # 1. Wait for m1 to be coordinator of C0 = {m1..m4}; m1 is asked to add m5.
  - {at: {event: Elected, member: m1}, do: {add: m5, at: m1}}
  # 2. While the change is in progress, cut m1 from m2, m3, m4 (m1 and m5 stay connected). C1 = {m1..m5} can reach only m5.
  - {at: {event: ChangeRequested, member: m1}, do: {cut: [[m1, m2], [m1, m3], [m1, m4]]}}
  # 3. Once m5 holds C1, cut m3 from m4, so that among m2, m3, m4 only m2 can gather three C0 votes.
  - {at: {event: Appended, member: m5, kind: config}, do: {cut: [[m3, m4]]}}
  # 4. m2, coordinator under C0 (no configuration entry in its journal), removes m4. C2 = {m1, m2, m3}, committed by m2 and m3; never sent to m4.
  - {at: {event: Elected, member: m2}, do: {remove: m4, at: m2}}
  # 5. Once m2 has committed, heal. m1 (C1, majority 3 of 5) can then be elected by m1, m4, m5, none of which holds C2: the coordinator lacks a committed entry (J1.2).
  - {at: {event: Committed, member: m2}, do: {heal: true}}
end: quiescent
bound: {events: 400}
