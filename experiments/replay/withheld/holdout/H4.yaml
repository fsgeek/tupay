scenario: H4
derives: [J1.3, G1.4]
initial: [m1, m2, m3, m4]
steps:
  # derives: H4 (J1.3, G1.4). Administrative requests arrive at the wrong member and are retried; then a change is requested that would not change the configuration. The contract says J1.3 holds by construction; the specification does not say what an add of a present member or a remove of an absent one appends.
  # Step 1: the add arrives at a follower, which must answer "not coordinator".
  - {at: {event: Elected}, do: {add: m5, at: follower}}
  # Step 2: the administrator retries at the coordinator; C1 = initial + m5 at index 1.
  - {at: {event: ChangeReplied}, do: {add: m5, at: coordinator}}
  # Step 3: the same add again, after it was answered ok: m5 is already a member; m5's journal matches, catch-up is immediate, C1 is committed, and the design's step 4 would append initial + m5 + m5 = C1 again.
  - {at: {event: ChangeReplied, status: ok}, do: {add: m5, at: coordinator}}
  # Step 4: whatever the duplicate was answered with, remove m5; C2 = C1 - m5.
  - {at: {event: ChangeReplied}, do: {remove: m5, at: coordinator}}
  # Step 5: remove m5 again, after the real removal was answered ok; m5 is no longer a member.
  - {at: {event: ChangeReplied, status: ok}, do: {remove: m5, at: coordinator}}
end: {settle: 100}
bound: {events: 400}
