    do: {"cell": "F1.1", "restart": "n1"}
  # derives: C1.1, F1.1
  - at: start
    do: {"cell": "F1.1", "restart": "n2"}
  # derives: C1.1, F1.1
  - at: start
    do: {"cell": "F1.1", "restart": "n3"}
  # derives: C1.1, F1.1
