# P2: independently authored implementation half
# derives: C1.1, F1.2
schedule: P2
derives: ["C1.1", "F1.2"]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: C1.1, F1.2
  - at: start
    do: {"request": "c1"}
  # derives: C1.1, F1.2
  - at: {"event": "Grant", "client": "c1"}
    do: {"cell": "F1.2", "partition": [["grantor", "c1", "s"], ["rest"]]}
  # derives: C1.1, F1.2
  - at: start
    do: {"request": "c2"}
  # derives: C1.1, F1.2
  - at: {"event": "Grant", "client": "c2"}
    do: {"cell": "F1.2", "heal": true}
end: {"event": "Grant", "client": "c2"}
bound: {events: 200}
