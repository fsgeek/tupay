# P4: independently authored implementation half
# derives: C1.2, F1.1
schedule: P4
derives: ["C1.2", "F1.1"]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: C1.2, F1.1
  - at: start
    do: {"request": "c1"}
  # derives: C1.2, F1.1
  - at: {"event": "Grant", "client": "c1"}
    do: {"write": "c1", "value": "old"}
  # derives: C1.2, F1.1
  - at: {"event": "WriteAck", "client": "c1", "outcome": "accepted"}
    do: {"request": "c2"}
  # derives: C1.2, F1.1
  - at: {"event": "Grant", "client": "c2"}
    do: {"write": "c2", "value": "new"}
  # derives: C1.2, F1.1
  - at: {"event": "WriteAck", "client": "c2", "outcome": "accepted"}
    do: {"cell": "F1.1", "crash": "s"}
  # derives: C1.2, F1.1
  - at: start
    do: {"cell": "F1.1", "restart": "s"}
  # derives: C1.2, F1.1
  - at: start
    do: {"write": "c1", "value": "stale-after-restart", "token": "stale"}
end: {"event": "WriteAck", "client": "c1", "outcome": "rejected"}
bound: {events: 200}
