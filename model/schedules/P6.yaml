schedule: P6
derives: [C1.2, F1.3]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
# derives: P6 (C1.2, F1.3). Paused holder resumes and writes after a newer token was accepted.
steps:
  - at: start
    do: {request: c1}
  - at: {event: Grant, client: c1}
    do: {cell: F1.3, pause: holder}
  - at: start
    do: {request: c2}
  - at: {event: Grant, client: c2}
    do: {write: c2, value: v2}
  - at: {event: WriteAck, client: c2}
    do: {cell: F1.3, resume: c1}
  - at: start
    do: {write: c1, value: v1}
end: start
bound: {events: 200}
