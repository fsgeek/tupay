schedule: P7
derives: [C1.3, F1.1]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
# derives: P7 (C1.3, F1.1). Storage crashes around a write, then the client crashes between
# accept and ack. No client is told success for a write storage did not accept.
steps:
  - at: start
    do: {request: c1}
  - at: {event: Grant, client: c1}
    do: {write: c1, value: v1}
  - at: {event: WriteAttempt, client: c1}
    do: {cell: F1.1, crash: s}
  - at: start
    do: {cell: F1.1, restart: s}
  - at: start
    do: {write: c1, value: v2}
  - at: {event: WriteAccept}
    do: {cell: F1.1, crash: c1}
  - at: start
    do: {cell: F1.1, restart: c1}
end: start
bound: {events: 200}
