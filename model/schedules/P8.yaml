schedule: P8
derives: [C1.3, F1.2]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
# derives: P8 (C1.3, F1.2). Holder cut off from storage right after writing; the write or
# its ack is lost in the partition. The client must not be told success.
steps:
  - at: start
    do: {request: c1}
  - at: {event: Grant, client: c1}
    do: {write: c1, value: v1}
  - at: {event: WriteAttempt, client: c1}
    do: {cell: F1.2, partition: [[holder], [rest]]}
  - at: start
    do: {cell: F1.2, heal: true}
end: start
bound: {events: 200}
