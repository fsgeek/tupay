schedule: P15
derives: [C2.1, F1.3]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P15 (C2.1, F1.3). Holder reads, is paused past lifetime; a newer holder writes; the resumed holder's read with its old token is rejected.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {read: c1}}
  - {at: {event: ReadAck, client: c1, outcome: served}, do: {cell: F1.3, pause: c1}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {cell: F1.3, resume: c1}}
  - {at: start, do: {read: c1}}
end: quiescent
bound: {events: 200}
