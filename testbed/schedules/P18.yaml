schedule: P18
derives: [C2.2, F1.3]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P18 (C2.2, F1.3). Client paused after its read is served; a newer holder writes; the late ack carries the value served, not the newer one.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1, outcome: accepted}, do: {read: c1}}
  - {at: {event: ReadAccept}, do: {cell: F1.3, pause: c1}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {cell: F1.3, resume: c1}}
  - {at: start, do: {read: c1, token: stale}}
end: quiescent
bound: {events: 200}
