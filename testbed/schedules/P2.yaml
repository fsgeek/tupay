schedule: P2
derives: [C1.1, F1.2]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P2 (C1.1, F1.2). Grantor and holder cut off with storage; the majority side elects and grants; tokens still increase.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {cell: F1.2, partition: [[grantor, holder, s], [rest]]}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {cell: F1.2, heal: true}}
  - {at: start, do: {request: c1}}
end: quiescent
bound: {events: 200}
