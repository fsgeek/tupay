schedule: P21
derives: [C1.2, F2.1]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P21 (C1.2, F2.1). The grantor loses only its links to the other lease nodes and still reaches both clients and storage; the majority grants to c2; c2's write is accepted; the old holder writes and is rejected.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F2.1, cut: [[grantor, n1], [grantor, n2], [grantor, n3]]}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {write: c1, value: v3}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F2.1, heal: true}}
end: quiescent
bound: {events: 200}
