schedule: P23
derives: [C1.3, F2.1]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P23 (C1.3, F2.1). Only the holder-storage link is cut, after storage accepts; the ack is lost and a second write never arrives; the holder still reaches the lease nodes; it is not told success for either.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAccept}, do: {cell: F2.1, cut: [[holder, s]]}}
  - {at: start, do: {write: c1, value: v2}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {cell: F2.1, heal: true}}
end: quiescent
bound: {events: 200}
