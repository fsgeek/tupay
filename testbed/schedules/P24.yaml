schedule: P24
derives: [C1.3, F2.2]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P24 (C1.3, F2.2). Storage hears the holder but cannot reply to it; two writes may be accepted; the holder is told success for neither.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {cell: F2.2, drop: [[s, holder]]}}
  - {at: start, do: {write: c1, value: v1}}
  - {at: {event: WriteAccept}, do: {write: c1, value: v2}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {cell: F2.2, heal: true}}
end: quiescent
bound: {events: 200}
