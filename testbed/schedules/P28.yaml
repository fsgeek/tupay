schedule: P28
derives: [C2.1, F2.2]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P28 (C2.1, F2.2). As P22 with a read: the old holder hears nothing from the lease nodes; c2 is granted and its write accepted; the old holder reads and is rejected.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F2.2, drop: [[n1, holder], [n2, holder], [n3, holder]]}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {read: c1}}
  - {at: {event: ReadAck, client: c1}, do: {cell: F2.2, heal: true}}
end: quiescent
bound: {events: 200}
