schedule: P29
derives: [C2.2, F2.1]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P29 (C2.2, F2.1). Only the holder-storage link is cut, after storage serves a read; the holder is not given a value; after the heal, a read is served and the value given matches storage.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1, outcome: accepted}, do: {read: c1}}
  - {at: {event: ReadAccept}, do: {cell: F2.1, cut: [[holder, s]]}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {cell: F2.1, heal: true}}
  - {at: start, do: {read: c2}}
end: quiescent
bound: {events: 200}
