schedule: P32
derives: [C3.1, F3.2]
processes:
  lease: [n1, n2, n3, n4]
  config: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P32 (C3.1, F3.2). The grantor's clock jumps back by three lifetimes once its reconfiguration request is recorded; committed epochs strictly increase and no epoch has two configurations.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {cell: F3.1, reconfigure: [n1, n2, n3, n4], to: grantor, id: r1}}
  - {at: {event: ReconfigRequest, request_id: r1}, do: {cell: F3.2, clock: grantor, step: -3}}
  - {at: start, do: {request: c2}}
end: quiescent
bound: {events: 400}
