schedule: P33
derives: [C3.1, F3.3]
processes:
  lease: [n1, n2, n3, n4]
  config: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P33 (C3.1, F3.3). After r1 is committed, n3 (which may have agreed to it; the model explores both) crashes and restarts amnesic, c2 requests, and request r2 is sent to n3; at most one configuration per epoch, committed in order. Every trigger here is owed by a clause (C3.4(b) commits r1: n1 receives it and everyone stays connected).
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {cell: F3.1, reconfigure: [n1, n2, n3, n4], to: n1, id: r1}}
  - {at: {event: ConfigCommitted, request_id: r1, decided: true}, do: {cell: F1.1, crash: n3}}
  - {at: start, do: {cell: F3.3, restart: n3, amnesia: true}}
  - {at: start, do: {request: c2}}
  - {at: start, do: {cell: F3.1, reconfigure: [n1, n2, n4], to: n3, id: r2}}
end: quiescent
bound: {events: 400}
