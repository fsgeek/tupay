schedule: P4
derives: [C1.2, F1.1]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P4 (C1.2, F1.1). Storage crashes and restarts after accepting a newer token; a stale write is still rejected.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1}, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {cell: F1.1, crash: s}}
  - {at: start, do: {cell: F1.1, restart: s}}
  - {at: start, do: {write: c1, value: v3, token: stale}}
end: quiescent
bound: {events: 200}
