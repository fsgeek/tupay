schedule: P49
derives: [C1.2, F3.1]
processes:
  lease: [n1, n2, n3, n4, n5]
  config: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P49 (C1.2, F3.1). c1, granted under epoch 0, is cut off from every lease node but not from storage while a reconfiguration commits and c2 is granted and writes; c1's later write is rejected.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F2.1, cut: [[c1, n1], [c1, n2], [c1, n3], [c1, n4], [c1, n5]]}}
  - {at: start, do: {cell: F3.1, reconfigure: [n2, n3, n4], to: n1, id: r1}}
  - {at: {event: ConfigCommitted, request_id: r1, decided: true}, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {write: c1, value: v3}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F2.1, heal: true}}
end: quiescent
bound: {events: 400}
