schedule: P5
derives: [C1.2, F1.2]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P5 (C1.2, F1.2). Grantor isolated alone; holder reaches storage; after the new grant's write is accepted, the old holder's write is rejected.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F1.2, partition: [[grantor], [rest]]}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {write: c2, value: v2}}
  - {at: {event: WriteAck, client: c2, outcome: accepted}, do: {write: c1, value: v3}}
  - {at: {event: WriteAck, client: c1}, do: {cell: F1.2, heal: true}}
end: quiescent
bound: {events: 200}
