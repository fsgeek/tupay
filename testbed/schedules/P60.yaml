schedule: P60
derives: [C3.7, F3.3]
processes:
  lease: [n1, n2, n3, n4]
  config: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P60 (C3.7, F3.3). After r1 (adding n4) is committed, n2 (which may have agreed to it; the model explores both) crashes and restarts amnesic and is not re-admitted; no grant counts an agreement of its new incarnation. n1, n3, n4 remain an eligible majority of four, so grants continue.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {cell: F3.1, reconfigure: [n1, n2, n3, n4], to: n1, id: r1}}
  - {at: {event: ConfigCommitted, request_id: r1, decided: true}, do: {cell: F1.1, crash: n2}}
  - {at: start, do: {cell: F3.3, restart: n2, amnesia: true}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {request: c1}}
end: quiescent
bound: {events: 400}
