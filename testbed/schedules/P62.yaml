schedule: P62
derives: [C3.8, F3.2]
processes:
  lease: [n1, n2, n3, n4]
  config: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P62 (C3.8, F3.2). The receiver n2's clock jumps forward five lifetimes after it records r1 and before the commit; op is not told success before the commit, which is counted by majorities of both configurations.
  - {at: start, do: {request: c1}}
