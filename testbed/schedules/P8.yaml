schedule: P8
derives: [C1.3, F1.2]
processes:
  lease: [n1, n2, n3]
  clients: [c1, c2]
  storage: [s]
steps:
  # derives: P8 (C1.3, F1.2). The accept's ack is lost in a partition and a second write never reaches storage; the client is not told success for either.
  - {at: start, do: {request: c1}}
  - {at: {event: Grant, client: c1}, do: {write: c1, value: v1}}
  - {at: {event: WriteAccept}, do: {cell: F1.2, partition: [[holder], [rest]]}}
  - {at: start, do: {write: c1, value: v2}}
  - {at: start, do: {request: c2}}
  - {at: {event: Grant, client: c2}, do: {cell: F1.2, heal: true}}
end: quiescent
bound: {events: 200}
